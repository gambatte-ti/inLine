<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento - Shortcut</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: row;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: none;
            margin: 0;
            width: auto;
        }

        .display {
            background-color: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .display-text {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            letter-spacing: 5px;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            flex: 1;
            width: 100%;
        }

        .key {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .key:hover {
            background-color: #45a049;
        }

        .key:active {
            transform: scale(0.95);
        }

        .key.delete {
            background-color: #ff6b6b;
        }

        .key.delete:hover {
            background-color: #ff5252;
        }

        .key.clear {
            background-color: #ffa500;
        }

        .key.clear:hover {
            background-color: #ff9500;
        }

        .footer {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 20px;
            background-color: #333;
            border-left: 2px solid #222;
            flex-shrink: 0;
            width: auto;
        }

        .footer-btn {
            flex: 1;
            padding: 8px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            color: white;
        }

        .btn-recall {
            background-color: #2196F3;
        }

        .btn-recall:hover {
            background-color: #0b7dda;
        }

        .btn-finish {
            background-color: #4CAF50;
        }

        .btn-finish:hover {
            background-color: #45a049;
        }

        .btn-recall:active,
        .btn-finish:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="display">
            <div class="display-text" id="display">0</div>
        </div>

        <div class="keyboard">
            <button class="key" onclick="addNumber('1')">1</button>
            <button class="key" onclick="addNumber('2')">2</button>
            <button class="key" onclick="addNumber('3')">3</button>
            
            <button class="key" onclick="addNumber('4')">4</button>
            <button class="key" onclick="addNumber('5')">5</button>
            <button class="key" onclick="addNumber('6')">6</button>
            
            <button class="key" onclick="addNumber('7')">7</button>
            <button class="key" onclick="addNumber('8')">8</button>
            <button class="key" onclick="addNumber('9')">9</button>
            
            <button class="key delete" onclick="deleteNumber()">DEL</button>
            <button class="key" onclick="addNumber('0')">0</button>
            <button class="key clear" onclick="clearDisplay()">CLR</button>
        </div>
    </div>

    <div class="footer">
        <button class="footer-btn btn-recall" onclick="recallOrder()">Chamar Pedido</button>
        <button class="footer-btn btn-finish" onclick="finishOrder()">Entregar Pedido</button>
    </div>

    <script>
        let currentNumber = '';

        function addNumber(num) {
            if (currentNumber.length < 4) {
                currentNumber += num;
                updateDisplay();
            }
        }

        function deleteNumber() {
            currentNumber = currentNumber.slice(0, -1);
            updateDisplay();
        }

        function clearDisplay() {
            currentNumber = '';
            updateDisplay();
        }

        function updateDisplay() {
            const display = document.getElementById('display');
            display.textContent = currentNumber || '0';
        }

        async function recallOrder() {
            if (!currentNumber) {
                alert('Digite um número de pedido');
                return;
            }

            try {
                const csrfToken = getCookie('csrftoken');
                const response = await fetch('/api/v1/expedicao/pedidos/', {
                    method: 'PATCH',
                    headers: {
                        'X-CSRFToken': csrfToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ senha: String(currentNumber) })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    const errorMsg = errorData.detail || errorData.error || 'Não foi possível chamar o pedido.';
                    throw new Error(Array.isArray(errorMsg) ? errorMsg.join(', ') : errorMsg);
                }

                alert('Pedido chamado com sucesso.');
                clearDisplay();
            } catch (error) {
                alert(error.message || 'Erro ao chamar pedido.');
            }
        }

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) {
                return parts.pop().split(';').shift();
            }
            return '';
        }

        async function confirmarEntrega(senha) {
            const listaResp = await fetch('/api/v1/atendimento/lista/');
            if (!listaResp.ok) {
                throw new Error('Falha ao consultar pedidos.');
            }

            const pedidos = await listaResp.json();
            const pedidosComSenha = pedidos.filter((p) => String(p.senha) === String(senha));
            const pedido = pedidosComSenha.find((p) => p.status === 'FINALIZADO') || pedidosComSenha[0];
            if (!pedido) {
                clearDisplay();
                throw new Error('Pedido não encontrado para a senha informada.');
            }

            const csrfToken = getCookie('csrftoken');
            const retirarResp = await fetch(`/api/v1/pedidos/retirar/${pedido.id}/`, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken,
                    'Content-Type': 'application/json'
                }
            });

            if (!retirarResp.ok) {
                const errorData = await retirarResp.json().catch(() => ({}));
                const errorMsg = errorData.detail || errorData.error || 'Não foi possível finalizar o pedido.';
                throw new Error(Array.isArray(errorMsg) ? errorMsg.join(', ') : errorMsg);
            }
        }

        async function finishOrder() {
            if (!currentNumber) {
                alert('Digite um número de pedido');
                return;
            }

            try {
                await confirmarEntrega(currentNumber);
                alert('Pedido finalizado com sucesso.');
                clearDisplay();
            } catch (error) {
                alert(error.message || 'Erro ao finalizar pedido.');
            }
        }
    </script>
</body>
</html>
